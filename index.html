<!doctype html>

        margin: 0;

        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;

        color: #e8e8ef;
        padding: 2rem;
        text-align: center;
      }
      main {
        max-width: 22rem;
